name: Build APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Andaa faili za app
        run: |
          mkdir www
          cp index.html config.js xl.js core.js license.js views.js views2.js actions.js styles.css sw.js manifest.webmanifest www/
          cp -r icons www/icons

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Tengeneza APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DukaKiganjani-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
