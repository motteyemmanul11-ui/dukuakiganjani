<script>
function showUpdate(){
  if(document.getElementById("updBar"))return;
  const b=document.createElement("div");b.id="updBar";
  b.style.cssText="position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:9999;background:#F2A541;color:#3a2500;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font:700 14px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)";
  b.innerHTML='<span style="flex:1">Toleo jipya la app limepatikana.</span><button id="updGo" style="border:0;background:#0E4D64;color:#fff;border-radius:10px;padding:9px 14px;font-weight:700">Sasisha</button><button id="updX" aria-label="Funga" style="border:0;background:transparent;font-size:22px;color:#3a2500">&times;</button>';
  document.body.appendChild(b);
  document.getElementById("updGo").onclick=()=>location.reload();
  document.getElementById("updX").onclick=()=>b.remove();
}
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    const hadSW=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(reg=>{
      const chk=()=>reg.update().catch(()=>{});
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()});
      setInterval(chk,30*60*1000);
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW)showUpdate()});
  });
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
