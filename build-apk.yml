name: Build APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Andaa faili za app
        run: |
          mkdir www
          cp index.html config.js xl.js core.js license.js views.js views2.js actions.js i18n.js zxing.min.js styles.css sw.js manifest.webmanifest www/
          cp -r icons www/icons

      - run: npm install
      - run: npx cap add android

      - name: Ruhusu kamera na scanner (barcode)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <application|' $M
          sed -i 's|</application>|    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui"/>\n    </application>|' $M
          sed -i 's|^android {|android {\n    buildFeatures {\n        dataBinding true\n    }|' android/app/build.gradle
          grep -n "CAMERA\|DEPENDENCIES" $M
          grep -n "dataBinding" android/app/build.gradle

      - run: npx cap sync android

      - name: Weka sahihi ya kudumu (kama ipo kwenye Secrets)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/duka.keystore
            cat > android/app/signing.gradle <<'EOF'
          android {
              signingConfigs {
                  debug {
                      storeFile file("duka.keystore")
                      storePassword System.getenv("KS_PASS")
                      keyAlias "duka"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
          }
          EOF
            echo "apply from: 'signing.gradle'" >> android/app/build.gradle
            echo "Sahihi ya kudumu imewekwa."
          else
            echo "ONYO: hakuna keystore kwenye Secrets, sahihi ya muda itatumika."
          fi

      - name: Tengeneza APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DukaKiganjani-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
